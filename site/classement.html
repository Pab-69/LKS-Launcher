<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Classements — Lowkey Syndicate</title>
    <meta name="description" content="Classements drift, tandem et chrono du Lowkey Syndicate, et championnats." />
    {{FAVICON}}
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page">
    <nav class="top">
      <a href="index.html">{{LOGO_WIDE}}</a>
      <div class="top-links"><a href="index.html">Accueil</a><a href="#championnats">Championnats</a></div>
    </nav>
    <main>
      <section>
        <h2>Classements</h2>
        <div class="filters">
          <label>Circuit <select id="f-track"></select></label>
          <label>Type <select id="f-kind">
            <option value="drift">Drift</option>
            <option value="tandem">Tandem</option>
            <option value="time">Chrono</option>
          </select></label>
          <label>Mode <select id="f-mode">
            <option value="normal">Normal</option>
            <option value="debutant">Débutant</option>
            <option value="pro">Compétition</option>
          </select></label>
          <label>Voiture <select id="f-car"><option value="">Toutes</option></select></label>
        </div>
        <p class="status" id="board-status">Chargement…</p>
        <div class="board-wrap"><table class="board" id="board" hidden>
          <thead><tr><th>#</th><th>Pilote</th><th>Voiture</th><th class="num" id="board-col">Note</th><th>Date</th></tr></thead>
          <tbody></tbody>
        </table></div>
      </section>
      <section id="championnats">
        <h2>Championnats</h2>
        <div id="champs"><p class="status">Chargement…</p></div>
      </section>
    </main>
    <footer><p>© {{YEAR}} Lowkey Syndicate — <a href="index.html">accueil</a>{{ADMIN_LINK}}</p></footer>
    <script src="config.js"></script>
    <script src="lks-shared.js"></script>
    <script src="site.js"></script>
    <script src="classement.js"></script>
  </body>
</html>
