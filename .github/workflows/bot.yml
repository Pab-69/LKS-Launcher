name: Bot Discord

on:
  push:
    paths: ['bot/**', '.github/workflows/bot.yml']
  pull_request:
    paths: ['bot/**', '.github/workflows/bot.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
