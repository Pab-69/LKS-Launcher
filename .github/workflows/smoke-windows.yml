name: Test Windows (application + mise à jour)

# Lancé à la main (Actions > Run workflow).
#  - ui     : démarre le vrai .exe Windows, vérifie le rendu, le manifeste et
#             l'identité visuelle en ligne, et fait des captures de chaque page.
#  - update : (expérimental, seulement si la case est cochée) installe une version
#             publiée, la laisse se mettre à jour seule et vérifie la version.
#             L'installeur NSIS plante en mode silencieux sur les machines
#             Windows Server de GitHub : ce test n'y est pas fiable pour l'instant.

on:
  workflow_dispatch:
    inputs:
      test_update:
        description: 'Tester aussi la mise à jour automatique (expérimental)'
        type: boolean
        default: false
      from_version:
        description: 'Version publiée à installer avant la mise à jour'
        default: '1.0.0'

permissions:
  contents: read

jobs:
  ui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Windows app (unpacked)
        run: npx electron-builder --win dir --publish never
      - name: Run the smoke test
        shell: bash
        run: node tools/smoke/ui.js "dist/win-unpacked/LKS Launcher.exe" smoke-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-windows
          path: smoke-shots/

  update:
    if: inputs.test_update
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Install the published version
        shell: pwsh
        run: |
          $v = "${{ inputs.from_version || '1.0.0' }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/v$v/LKS-Launcher-Setup-$v.exe"
          Invoke-WebRequest $url -OutFile setup.exe
          Write-Host "Téléchargé : $((Get-Item setup.exe).Length) octets"
          # don't use -Wait: it also waits for the launcher the installer may start
          $inst = Start-Process .\setup.exe -ArgumentList '/S', '/currentuser' -PassThru
          if (-not $inst.WaitForExit(240000)) { Write-Host "L'installeur tourne encore après 4 min"; Get-Process | Where-Object { $_.ProcessName -match 'setup|LKS|nsis|Un_' } | Format-Table ProcessName, Id, MainWindowTitle | Out-String | Write-Host }
          else { Write-Host "Code de sortie de l'installeur : $($inst.ExitCode)" }
          Start-Sleep 3
          Get-Process -Name 'LKS Launcher' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Launcher démarré par l'installeur (PID $($_.Id)), fermeture"; Stop-Process $_ -Force }
          Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Directory -ErrorAction SilentlyContinue | Where-Object Name -like '*lks*' | ForEach-Object { Write-Host "Dossier : $($_.FullName)"; Get-ChildItem $_.FullName | Select-Object -First 8 Name }
          # find the install through the uninstall registry entry (per-user or per-machine)
          $exe = $null
          for ($i = 0; $i -lt 30 -and -not $exe; $i++) {
            $keys = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'LKS Launcher*' }
            foreach ($k in $keys) {
              $dir = if ($k.InstallLocation) { $k.InstallLocation } else { Split-Path ($k.UninstallString -replace '"', '' -replace ' /.*$', '') }
              $candidate = Join-Path $dir 'LKS Launcher.exe'
              if (Test-Path $candidate) { $exe = Get-Item $candidate }
            }
            if (-not $exe) { Start-Sleep 2 }
          }
          if (-not $exe) {
            # fall back to a file search in the usual install folders
            $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles\LKS Launcher" -Recurse -Filter 'LKS Launcher.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) {
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Select-Object FullName
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Select-Object DisplayName, InstallLocation | Format-Table | Out-String | Write-Host
            throw "Installation introuvable"
          }
          "EXE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Installé : $($exe.FullName) — version $($exe.VersionInfo.ProductVersion)"
          if ($exe.VersionInfo.ProductVersion -ne $v) { throw "Version installée inattendue" }

      - name: Let it update itself
        shell: pwsh
        run: |
          $latest = (Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases/latest").tag_name.TrimStart('v')
          "LATEST=$latest" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Dernière version publiée : $latest"
          $p = Start-Process $env:EXE -PassThru
          # the launcher checks for updates at start-up and downloads in the background
          $cache = "$env:LOCALAPPDATA\lks-launcher-updater\pending"
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 5
            $ready = Get-ChildItem $cache -Filter "*$latest*.exe" -ErrorAction SilentlyContinue
            if ($ready) { Write-Host "Mise à jour téléchargée : $($ready.Name)"; break }
          }
          if (-not $ready) {
            Get-ChildItem "$env:LOCALAPPDATA" -Directory | Select-Object Name
            Get-ChildItem "$env:LOCALAPPDATA\lks-launcher-updater" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            Get-Content "$env:APPDATA\LKS Launcher\logs\*" -ErrorAction SilentlyContinue | Select-Object -Last 40
            throw "La mise à jour n'a pas été téléchargée"
          }
          Start-Sleep 5
          # close the launcher normally: the update installs silently on exit
          taskkill /PID $p.Id /T | Out-Null
          Start-Sleep 60

      - name: Check the installed version
        shell: pwsh
        run: |
          $exe = Get-Item $env:EXE
          $v = $exe.VersionInfo.ProductVersion
          Write-Host "Version installée après mise à jour : $v (attendue : $env:LATEST)"
          if ($v -ne $env:LATEST) { throw "La mise à jour automatique n'a pas été installée" }
