name: Bootstrap identité visuelle (ponctuel)

# Publie une première fois l'identité visuelle du Lowkey Syndicate dans la
# release "content", à partir des fichiers d'un ancien commit (ils ne sont plus
# dans le code). Ensuite, les admins utilisent Publication > Identité visuelle.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild the branding pack
        run: |
          mkdir pack
          git show c666e75:src/renderer/img/logo.png > pack/logo.png
          git show c666e75:src/renderer/img/logo-wide.png > pack/logo-wide.png
          git show c666e75:assets/logo-block.png > pack/logo-block.png
          git show c666e75:assets/icon.png > pack/icon.png
          for car in bmw-m2 supra-a90 silvia-s15; do git show c666e75:src/renderer/img/cars/$car.jpg > pack/$car.jpg; done
          cat > pack/showcase.json <<'JSON'
          [
            { "image": "bmw-m2.jpg", "title": "BMW M2", "subtitle": "Pablo · #17 · Livrée Syndicate", "position": "center 55%" },
            { "image": "supra-a90.jpg", "title": "Toyota GR Supra", "subtitle": "Livrée Lowkey Syndicate · Bleu nuit", "position": "center 60%" },
            { "image": "silvia-s15.jpg", "title": "Nissan Silvia S15", "subtitle": "Drift Team · Toile d’araignée", "position": "center 55%" }
          ]
          JSON
          ls -la pack
      - name: Publish to the "content" release
        run: node tools/publish-branding.js pack "${{ github.repository }}" content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
