# Serveur du groupe LKS : classement, notes des runs, qui est en ligne,
# propositions, galerie. À lancer avec ./lks.sh (voir README.md).
#
#   caddy     : HTTPS (certificat Let's Encrypt automatique), seul service ouvert sur internet
#   rest      : l'API lue et écrite par les launchers (PostgREST, même API que Supabase)
#   storage   : fichiers des propositions et de la galerie
#   admin     : soirées et actus depuis le site (avec le jeton GitHub, jamais envoyé au navigateur)
#   db        : la base PostgreSQL (jamais ouverte sur internet)
#   ops       : ménage toutes les heures + sauvegarde chaque jour (7 jours gardés)
#
# Aucun journal d'accès : les adresses IP des membres ne sont écrites nulle part.

name: lks

x-logs: &logs
  logging:
    driver: local
    options:
      max-size: 5m
      max-file: '2'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?lance ./lks.sh install}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?lance ./lks.sh install}
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./db/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ../docs/leaderboard.sql:/docker-entrypoint-initdb.d/10-leaderboard.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lks']
      interval: 5s
      timeout: 5s
      retries: 20
    <<: *logs

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/lks
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?lance ./lks.sh install}
      PGRST_DB_MAX_ROWS: '1000'
      PGRST_OPENAPI_MODE: disabled
      PGRST_LOG_LEVEL: error
    <<: *logs

  storage:
    image: node:22-alpine
    restart: unless-stopped
    user: node
    working_dir: /app
    command: ['node', 'server.js']
    environment:
      ANON_KEY: ${ANON_KEY:?lance ./lks.sh install}
      DATA_DIR: /data
      MAX_TOTAL_GB: ${STORAGE_MAX_GB:-20}
    volumes:
      - ./storage/server.js:/app/server.js:ro
      - ../src/main/imagemeta.js:/app/imagemeta.js:ro
      - ./data/storage:/data
    <<: *logs

  admin:
    image: node:22-alpine
    restart: unless-stopped
    user: node
    working_dir: /app
    command: ['node', 'server.js']
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CONTENT_REPO: ${CONTENT_REPO:-Pab-69/LKS-Launcher}
      SITE_ORIGINS: ${SITE_ORIGINS:-}
      ADMINS_FILE: /app/admins
      TZ: Europe/Paris
    volumes:
      - ./admin/server.js:/app/server.js:ro
      - ../src/main/telemetry/championship.js:/app/championship.js:ro
      - ./admins:/app/admins:ro
    <<: *logs

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [rest, storage, admin]
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      DOMAIN: ${DOMAIN:?lance ./lks.sh install}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    <<: *logs

  ops:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_DAYS:-7}
    entrypoint: ['/bin/sh', '/ops.sh']
    volumes:
      - ./db/ops.sh:/ops.sh:ro
      - ./backups:/backups
    <<: *logs
